server:
  port: ${PORT:8080}

spring:
  application:
    name: z-comm-cx
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zcommcx}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:zcommcx_app}
    password: ${SPRING_DATASOURCE_PASSWORD:zcommcx_app}
    hikari:
      # Supabase Session Pooler(무료 플랜)는 프로젝트 전체 동시 연결을 pool_size=15로 제한한다.
      # 기본값(인스턴스당 최대 10)을 그대로 두면 배포 중 이전 인스턴스와 겹치는 순간 15를 넘어
      # "max clients reached" 에러로 기동에 실패할 수 있어 넉넉히 낮춰둔다.
      maximum-pool-size: 5
      minimum-idle: 2
      # 배포 중 인스턴스가 비정상 종료되면(크래시성 재시작 등) HikariCP가 정리 못한 연결이
      # Supabase 쪽에 idle로 남을 수 있다. 유휴/최대수명을 짧게 잡아 정상 종료된 커넥션은
      # 스스로 회수되도록 해서, 다음 배포 시 15개 한도 초과 위험을 조금이라도 낮춘다.
      idle-timeout: 180000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  base-url: https://generativelanguage.googleapis.com/v1beta
  max-reviews-per-summary: 30
  usage:
    # 배포 환경(Render)은 로컬과 다른 계정을 쓰고 있어 한도가 더 크다. 환경변수로 오버라이드한다.
    # 여기 값은 gemini-3.5-flash-lite 무료 등급 기준 기본값이며, 실제로는 RPD만 추적/표시하고
    # RPM/TPM은 참고 표시용이다.
    tier: ${GEMINI_TIER:무료}
    rpm-limit: ${GEMINI_RPM_LIMIT:15}
    tpm-limit: ${GEMINI_TPM_LIMIT:250000}
    rpd-limit: ${GEMINI_RPD_LIMIT:500}

guardrail:
  return-window-days: 7

google:
  client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    com.zcommcx: INFO
