server:
  port: ${PORT:8080}

spring:
  application:
    name: z-comm-cx
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zcommcx}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:zcommcx_app}
    password: ${SPRING_DATASOURCE_PASSWORD:zcommcx_app}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-flash-latest
  base-url: https://generativelanguage.googleapis.com/v1beta
  max-reviews-per-summary: 30

guardrail:
  return-window-days: 7

google:
  client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    com.zcommcx: INFO
