server:
  port: ${PORT:8080}

spring:
  application:
    name: z-comm-cx
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zcommcx}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:zcommcx_app}
    password: ${SPRING_DATASOURCE_PASSWORD:zcommcx_app}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  base-url: https://generativelanguage.googleapis.com/v1beta
  max-reviews-per-summary: 30
  usage:
    # 배포 환경(Render)은 로컬과 다른 계정을 쓰고 있어 한도가 더 크다. 환경변수로 오버라이드한다.
    # 여기 값은 gemini-3.5-flash-lite 무료 등급 기준 기본값이며, 실제로는 RPD만 추적/표시하고
    # RPM/TPM은 참고 표시용이다.
    tier: ${GEMINI_TIER:무료}
    rpm-limit: ${GEMINI_RPM_LIMIT:15}
    tpm-limit: ${GEMINI_TPM_LIMIT:250000}
    rpd-limit: ${GEMINI_RPD_LIMIT:500}

guardrail:
  return-window-days: 7

google:
  client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    com.zcommcx: INFO
